[tool.poetry]
name = "management"
version = "0.1.0"
description = "FastAPI management backend"
authors = ["DarkScry Team <team@example.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = "^0.115.2"
uvicorn = "^0.34.0"
sqlalchemy = "^2.0"
asyncpg = "^0.29.0"
pydantic = "^2.6"
pydantic-settings = "^2.2"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.3"}
fastapi-utils = "^0.8.0"
typing-inspect = "^0.9.0"
bcrypt = "<4.1"
alembic = "^1.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
httpx = "^0.27"
asgi-lifespan = "^2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.poetry.scripts]
manager = "scripts.manager:main"
