
services:

  c2server:
    build:
      context: ./c2server
      dockerfile: docker/Dockerfile
    container_name: darkscry_c2server

    ports:
      - "${C2SERVER_PORT:-9100}:9100"
      - "1234:1234"
      - "876:876"

    environment:
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      C2_SERVER_HOST: "${C2_SERVER_HOST}"
      C2_SERVER_PORT: "${C2_SERVER_PORT}"
      C2_SERVER_REDIS_DB: "${C2_SERVER_REDIS_DB}"

    command: >
      poetry run python test.py

    depends_on:
      - redis
    restart: unless-stopped

  management:
    build:
      context: ./Management
      dockerfile: docker/Dockerfile
    container_name: darkscry_management
    ports:
      - "${MANAGEMENT_PORT:-8000}:8000"
    environment:
      MANAGEMENT_DATABASE_URL: "postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
      MANAGEMENT_SECRET_KEY: "${MANAGEMENT_SECRET_KEY}"
      MANAGEMENT_DEBUG: "${MANAGEMENT_DEBUG:-False}"
      MANAGEMENT_CORS_ORIGINS: "${MANAGEMENT_CORS_ORIGINS:-http://localhost:3000}"
      MANAGEMENT_REDIS_HOST: "${REDIS_HOST}"
      MANAGEMENT_REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      MANAGEMENT_REDIS_PORT: "6379"
      MANAGEMENT_ARQ_REDIS_DB: "${MANAGEMENT_ARQ_REDIS_DB:-4}"
    depends_on:
      - c2server
      - db
    restart: unless-stopped

  

  
  redis:
    image: redis:7-alpine
    container_name: darkscry_redis
    ports:
      - "6379"
    restart: unless-stopped

  
  db:
    image: postgres:14-alpine
    container_name: darkscry_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD_FILE: "/run/secrets/db_password" 
    volumes:
      - darkscry_postgres_data:/var/lib/postgresql/data
      - db_password:/run/secrets
    restart: unless-stopped

  arqworker:
    build:
      context: .
      dockerfile: ./dockerfiles/arq.dockerfile
    container_name: darkscry_arqworker
    environment:
      MANAGEMENT_REDIS_HOST: "${REDIS_HOST}"
      MANAGEMENT_REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      MANAGEMENT_REDIS_PORT: "6379"
      MANAGEMENT_ARQ_REDIS_DB: "${MANAGEMENT_ARQ_REDIS_DB:-4}"

      C2_SERVER_HOST: "${C2_SERVER_HOST}"
      C2_SERVER_PORT: "${C2_SERVER_PORT}"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MANAGEMENT_API_URL: "${NEXT_PUBLIC_MANAGEMENT_API_URL}"
        NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL}"
        NEXTAUTH_URL: "${NEXTAUTH_URL}"
        NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
    container_name: darkscry_frontend
    
    ports:
      - "3000:3000"

    depends_on:
      - management

    restart: unless-stopped

volumes:
  darkscry_postgres_data:
  db_password:  
